<section style="padding: 36px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: #4F7A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">

</div>
<h1 style="margin: 8px 0 0; font-size: 28px; font-weight: 800">Contato liberado</h1>
<p style="margin: 0; font-size: 17px; font-weight: 700; color: #4A433D">Joana · Diarista</p>
</section>
<section style="margin: 0 20px; padding: 18px; background: #FFFFFF; border: 1px solid #E8DED3; border-radius: 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; color: #6B625A; text-transform: uppercase; letter-spacing: 0.05em">WhatsApp</span>
<span style="font-size: 22px; font-weight: 800">[número de WhatsApp]</span>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border: 0; border-radius: 16px; background: #4F7A4A; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">

Chamar no WhatsApp</button>
<p style="margin: 0; font-size: 14px; line-height: 1.4; color: #6B625A">A Joana foi avisada de que você liberou o contato dela.</p>
</section>
<section style="margin: 14px 20px 0; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8DED3; display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625A" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<span>Combine valor, dias e horário direto com a Joana. O Ajuda em Casa não participa do pagamento do serviço.</span>
</section>
<section style="margin: 10px 20px 0; padding: 14px 16px; border-radius: 16px; background: #F6E3DC; color: #6E2A1B; display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.45">
<strong style="font-size: 15px; font-weight: 800">Vai contratar por mês?</strong>
<span>Mais de 2 dias por semana na mesma casa é emprego doméstico: carteira assinada e registro no eSocial (Lei Complementar 150/2015).</span>
</section>
<section style="margin: 18px 20px 0; padding: 18px; border-radius: 20px; background: #FFFFFF; border: 2px dashed #D9CBBB; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 800; color: #6B625A; text-transform: uppercase; letter-spacing: 0.05em">Daqui a 48 horas</span>
<h2 style="margin: 0; font-size: 20px; font-weight: 800">Conseguiu falar com a Joana?</h2>
<template data-if="{{asking}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{sayYes}}" style="min-height: 52px; border: 2px solid #4F7A4A; border-radius: 14px; background: #FFFFFF; color: #3D5F39; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Sim</button>
<button type="button" onClick="{{sayNo}}" style="min-height: 52px; border: 2px solid #E8DED3; border-radius: 14px; background: #FFFFFF; color: #2B2B2B; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Não consegui</button>
</div>
</template>
<template data-if="{{answered}}">
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #E3EDE1; color: #2E4A2B; font-size: 15px; font-weight: 700; line-height: 1.4">{{answerText}}</p>
</template>
<p style="margin: 0; font-size: 13px; color: #6B625A">É assim que medimos se a lista está atualizada.</p>
</section>
<div style="margin: 18px 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px">
<template data-if="{{pago}}">
<span style="font-weight: 700; color: #4A433D">Você tem 2 créditos</span>
</template>
<a href="Morador-Lista.html" style="display: inline-flex; align-items: center; min-height: 44px; margin-left: auto; font-weight: 800">Ver outros profissionais</a>
</div>
<nav aria-label="Menu principal" style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E8DED3; padding: 8px 4px 22px">
<a href="Inicio.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 700; color: #6B625A; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4.2-6 8-6s7 2 8 6"></path></svg>
Conta</a>
<a href="Morador-Lista.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 700; color: #6B625A; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.8c1.9.7 3.1 2.4 3.5 5.2"></path></svg>
Profissionais</a>
<a href="Morador-MinhasVagas.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 700; color: #6B625A; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"></path></svg>
Minhas vagas</a>
<a href="Morador-Contato.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 800; color: #B0472F; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"></path></svg>
Contatos</a>
</nav>
</div>
</template>
<script type="application/json" id="props">{"modo":{"editor":"enum","options":["gratuito","pago"],"default":"gratuito","section":"Modo do app"},"$preview":{"width":390,"height":1180}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const answer = (this.state || {}).answer || null;
    let answerText = "";
    if (answer === "sim") answerText = "Que bom! Depois do serviço, você poderá avaliar a Joana.";
    if (answer === "nao") answerText = "Obrigado por avisar. Isso ajuda a manter a lista atualizada.";
    return {
      pago: (this.props.modo ?? "gratuito") === "pago",
      asking: answer === null,
      answered: answer !== null,
      answerText: answerText,
      sayYes: function () { self.setState({ answer: "sim" }); },
      sayNo: function () { self.setState({ answer: "nao" }); }
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
