<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ajuda em Casa · Comprar créditos</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0472F}a:hover{color:#8A3522}
</style>
<link rel="stylesheet" href="prototipo.css">
</head>
<body>
<div class="faixa">
<span>Protótipo · dados de exemplo</span>
<span class="faixa-acoes"><a href="telas.html">Todas as telas</a></span>
</div>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #FAF5EE; font-family: 'Nunito', system-ui, sans-serif; color: #2B2B2B; display: flex; flex-direction: column">
<div style="padding: 16px 12px 0">
<a href="Morador-Lista.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 16px; font-weight: 800; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
Voltar</a>
</div>
<section style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15">Comprar créditos</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #4A433D">1 crédito libera o WhatsApp de 1 profissional, de qualquer categoria.</p>
</section>
<fieldset style="margin: 20px 20px 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 800; color: #6B625A; text-transform: uppercase; letter-spacing: 0.05em">Escolha o pacote</legend>
<template data-for="{{packs}}" data-as="p">
<label style="display: flex; align-items: center; gap: 14px; padding: 18px 16px; border-radius: 18px; cursor: pointer; background: {{p.bg}}; border: 2px solid {{p.border}}">
<input type="radio" name="pacote" value="{{p.id}}" checked="{{p.checked}}" onChange="{{p.pick}}" style="width: 22px; height: 22px; margin: 0; accent-color: #B0472F; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-size: 20px; font-weight: 800">{{p.title}}</span>
<span style="font-size: 14px; font-weight: 700; color: #6B625A">{{p.each}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="font-size: 22px; font-weight: 800">{{p.price}}</span>
<template data-if="{{p.best}}">
<span style="padding: 2px 8px; border-radius: 999px; background: #E3EDE1; color: #3D5F39; font-size: 12px; font-weight: 800">Mais econômico</span>
</template>
</span>
</label>
</template>
<p style="margin: 0; font-size: 14px; color: #6B625A">Os créditos valem 60 dias.</p>
</fieldset>
<fieldset style="margin: 20px 20px 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 800; color: #6B625A; text-transform: uppercase; letter-spacing: 0.05em">Forma de pagamento</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<template data-for="{{methods}}" data-as="m">
<label style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 14px; border-radius: 14px; cursor: pointer; font-size: 17px; font-weight: 800; background: {{m.bg}}; border: 2px solid {{m.border}}">
<input type="radio" name="metodo" value="{{m.id}}" checked="{{m.checked}}" onChange="{{m.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #B0472F">
{{m.label}}</label>
</template>
</div>
</fieldset>
<section style="margin: 20px 20px 0; padding: 16px 18px; border-radius: 18px; background: #E3EDE1; color: #2E4A2B; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 800; color: #3D5F39">O combinado</h2>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.4">
<li style="display: flex; gap: 8px; align-items: flex-start">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D5F39" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg>
<span>Só aparece quem confirmou disponibilidade nos últimos 14 dias.</span>
</li>
<li style="display: flex; gap: 8px; align-items: flex-start">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D5F39" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg>
<span>Sem renovação automática: você só paga quando comprar de novo.</span>
</li>
<li style="display: flex; gap: 8px; align-items: flex-start">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D5F39" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg>
<span>Ver de novo um contato já liberado não gasta crédito.</span>
</li>
</ul>
</section>
<div style="margin-top: auto; padding: 16px 20px 26px; background: #FFFFFF; border-top: 1px solid #E8DED3; display: flex; flex-direction: column; gap: 10px">
<a href="Morador-Lista.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">{{payLabel}}</a>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #6B625A; text-align: center">Pagamento pelo Mercado Pago. Venda feita pela MCCR, CNPJ 48.921.916/0001-00. Os créditos entram assim que o pagamento for confirmado.</p>
</div>
</div>
</template>
<script type="application/json" id="props">{"$preview":{"width":390,"height":1120}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const pack = s.pack || "p3";
    const method = s.method || "pix";
    const packs = [
      { id: "p3", title: "3 contatos", each: "R$ 6,63 por contato", price: "R$ 19,90", best: false },
      { id: "p8", title: "8 contatos", each: "R$ 4,99 por contato", price: "R$ 39,90", best: true }
    ].map(function (p) {
      const sel = p.id === pack;
      return Object.assign({}, p, {
        checked: sel,
        bg: sel ? "#FFFFFF" : "#FAF5EE",
        border: sel ? "#B0472F" : "#E8DED3",
        pick: function () { self.setState({ pack: p.id }); }
      });
    });
    const methods = [
      { id: "pix", label: "Pix" },
      { id: "cartao", label: "Cartão" }
    ].map(function (m) {
      const sel = m.id === method;
      return Object.assign({}, m, {
        checked: sel,
        bg: sel ? "#FFFFFF" : "#FAF5EE",
        border: sel ? "#B0472F" : "#E8DED3",
        pick: function () { self.setState({ method: m.id }); }
      });
    });
    const price = pack === "p8" ? "R$ 39,90" : "R$ 19,90";
    const how = method === "pix" ? "com Pix" : "no cartão";
    return {
      packs: packs,
      methods: methods,
      payLabel: "Pagar " + price + " " + how
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
