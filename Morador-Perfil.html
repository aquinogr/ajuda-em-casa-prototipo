<svg width="18" height="18" viewBox="0 0 24 24" fill="#B0472F" stroke="#B0472F" aria-hidden="true" style="stroke-width: 1.5; stroke-linejoin: round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5z"></path></svg>
4,8 · 12</span>

<a href="Morador-Contato.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.6-5.2A8.5 8.5 0 1 1 21 12z"></path></svg>
{{ctaLabel}}</a>

<p style="margin: 0; font-size: 13px; line-height: 1.4; color: #6B625A">A Joana será avisada de que você liberou o contato dela.</p>

<script type="application/json" id="props">{"modo":{"editor":"enum","options":["gratuito","pago"],"default":"gratuito","section":"Modo do app"},"$preview":{"width":390,"height":1300}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const pago = (this.props.modo ?? "gratuito") === "pago";
    return {
      pago: pago,
      dispText: pago ? "Disponível · confirmou há 3 dias" : "Disponível",
      ctaLabel: pago ? "Liberar WhatsApp · 1 crédito" : "Ver WhatsApp · grátis"
    };
  }
}
</script>
<script src="runtime.js"></script>
