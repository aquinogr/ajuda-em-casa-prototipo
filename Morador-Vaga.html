<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

</head>
<body>
<div class="faixa">
<span>Protótipo · dados de exemplo</span>
<span class="faixa-acoes"><a href="telas.html">Todas as telas</a></span>
</div>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 2200px; box-sizing: border-box; background: #FAF5EE; font-family: 'Nunito', system-ui, sans-serif; color: #2B2B2B; display: flex; flex-direction: column">
<div style="padding: 16px 12px 0">
<a href="Morador-Lista.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 16px; font-weight: 800; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
Profissionais</a>
</div>
<template data-if="{{published}}">
<section style="margin: 16px 20px 0; padding: 24px 20px; background: #FFFFFF; border: 1px solid #E8DED3; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: #4F7A4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12l5 5 9-10"></path></svg>
</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 800">Vaga publicada</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4A433D">Os profissionais de {{catLower}} recebem um aviso. Quem tiver interesse aparece em "Minhas vagas", e você decide quem chamar.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A">A vaga fica aberta por 30 dias ou até você marcar como preenchida.</p>
<a href="Morador-MinhasVagas.html" style="display: flex; align-items: center; justify-content: center; align-self: stretch; min-height: 56px; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">Ver minhas vagas</a>
<button type="button" onClick="{{editar}}" style="min-height: 44px; border: 0; background: transparent; color: #8A3522; font-family: inherit; font-size: 15px; font-weight: 800; text-decoration: underline; cursor: pointer">Editar a vaga</button>
</section>
</template>
<template data-if="{{editing}}">
<div style="display: flex; flex-direction: column">
<section style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15">Publicar vaga</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #4A433D">Diga o que você precisa. Os profissionais mostram interesse e você decide quem chamar.</p>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 14px; font-weight: 700; color: #6B625A"><span>Já veio preenchida com a sua busca.</span><span style="color: #3D5F39">Publicar é grátis.</span></p>
</section>
<form style="padding: 0 20px; margin-top: 22px; display: flex; flex-direction: column; gap: 26px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 20px; font-weight: 800">1. Quem você procura</legend>
<template data-for="{{groups}}" data-as="g">
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 13px; font-weight: 800; color: #6B625A; text-transform: uppercase; letter-spacing: 0.05em">{{g.title}}</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{g.chips}}" data-as="c">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}">{{c.label}}</button>
</template>
</div>
</div>
</template>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 20px; font-weight: 800">2. Como vai ser</legend>
<div role="group" aria-label="Forma de trabalho" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{formas}}" data-as="c">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}">{{c.label}}</button>
</template>
</div>
<template data-if="{{mensal}}">
<p style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #F6E3DC; color: #6E2A1B; font-size: 14px; line-height: 1.45">Trabalho mensal (mais de 2 dias por semana na mesma casa) é emprego doméstico: carteira assinada, eSocial e pelo menos um salário mínimo.</p>
</template>
<span style="font-size: 15px; font-weight: 800; margin-top: 6px">Dias</span>
<div role="group" aria-label="Dias" style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{dias}}" data-as="c">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-width: 64px; min-height: 48px; padding: 0 12px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}">{{c.label}}</button>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
<label for="horario" style="font-size: 15px; font-weight: 800">Horário</label>
<input id="horario" type="text" placeholder="Ex.: 8h às 17h" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="valor" style="font-size: 15px; font-weight: 800">Quanto você paga <span style="font-weight: 700; color: #6B625A">(opcional)</span></label>
<input id="valor" type="text" placeholder="Ex.: R$ 150 por dia" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
<span style="font-size: 13px; color: #6B625A">Se deixar em branco, aparece "Valor a combinar".</span>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 20px; font-weight: 800">3. Requisitos <span style="font-size: 15px; font-weight: 700; color: #6B625A">(opcional)</span></legend>
<p style="margin: 0 0 4px; font-size: 14px; color: #6B625A">Todos os profissionais já têm a identidade conferida.</p>
<template data-for="{{reqs}}" data-as="r">
<label style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; border: 1px solid #E8DED3; font-size: 16px; cursor: pointer">
<input type="checkbox" checked="{{r.checked}}" onChange="{{r.pick}}" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #B0472F">
{{r.label}}</label>
</template>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 6px">
<label for="outros" style="font-size: 15px; font-weight: 800">Outro requisito</label>
<input id="outros" type="text" placeholder="Ex.: saber cozinhar comida sem glúten" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 20px; font-weight: 800">4. Detalhes <span style="font-size: 15px; font-weight: 700; color: #6B625A">(opcional)</span></legend>
<label for="detalhes" style="font-size: 15px; font-weight: 700; color: #4A433D">Conte o que mais o profissional precisa saber</label>
<textarea id="detalhes" rows="4" placeholder="Ex.: casa de 3 quartos, com dois cachorros." style="padding: 12px 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; line-height: 1.45; color: #2B2B2B; resize: vertical; box-sizing: border-box"></textarea>
</fieldset>
<p style="margin: 0; display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8DED3; font-size: 15px; line-height: 1.45">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625A" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
<span>Local: <strong>Buona Vita</strong>. Os profissionais veem só o condomínio, nunca o seu nome, endereço ou telefone.</span>
</p>
<button type="button" onClick="{{publicar}}" style="min-height: 56px; border: 0; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer; margin-bottom: 28px">Publicar vaga</button>
</form>
</div>
</template>
</div>
</template>
<script type="application/json" id="props">{"$preview":{"width":390,"height":2200}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  toggle(key, value) {
    const s = this.state || {};
    const cur = Object.assign({}, s[key] || {});
    cur[value] = !cur[value];
    const patch = {};
    patch[key] = cur;
    this.setState(patch);
  }
  renderVals() {
    const self = this;
    const s = this.state || {};
    const cat = s.cat || "Diarista";
    const forma = s.forma || "Diária";
    const visual = function (on) {
      return { bg: on ? "#B0472F" : "#FFFFFF", fg: on ? "#FFFFFF" : "#2B2B2B", border: on ? "#B0472F" : "#E8DED3", pressed: on ? "true" : "false" };
    };
    const umaSo = function (key, lista, atual) {
      return lista.map(function (n) {
        return Object.assign({ label: n, pick: function () { const p = {}; p[key] = n; self.setState(p); } }, visual(n === atual));
      });
    };
    const varias = function (key, lista) {
      const sel = s[key] || {};
      return lista.map(function (n) {
        return Object.assign({ label: n, checked: !!sel[n], pick: function () { self.toggle(key, n); } }, visual(!!sel[n]));
      });
    };
    const domestico = ["Diarista", "Empregada doméstica", "Babá", "Cozinheira", "Passadeira", "Cuidador(a) de idosos", "Caseiro"];
    const reparos = ["Jardineiro", "Piscineiro", "Pintor", "Pedreiro", "Encanador", "Eletricista", "Técnico de bombas e piscinas", "Limpeza de caixa de gordura", "Limpeza de caixa d'água"];
    return {
      published: !!s.published,
      editing: !s.published,
      groups: [
        { title: "Trabalho doméstico", chips: umaSo("cat", domestico, cat) },
        { title: "Serviços e reparos", chips: umaSo("cat", reparos, cat) }
      ],
      formas: umaSo("forma", ["Diária", "Mensal", "Por serviço"], forma),
      mensal: forma === "Mensal",
      dias: varias("dias", ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"]),
      reqs: varias("reqs", ["Antecedentes conferidos", "Pelo menos 1 ano de experiência", "Referências de outras casas", "Dormir no emprego"]),
      catLower: cat.toLowerCase(),
      publicar: function () { self.setState({ published: true }); },
      editar: function () { self.setState({ published: false }); }
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
