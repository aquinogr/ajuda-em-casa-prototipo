<script type="application/json" id="props">{"$preview":{"width":390,"height":1450}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const tipo = s.tipo || "profissional";
    const textos = {
      profissional: "Olá! Tenho uma diarista de confiança disponível: Joana, 38 anos, mora em Vila Eduardo e trabalha de segunda, quarta e sexta. Identidade conferida pelo Ajuda em Casa.\n\nMeu serviço custa R$ 200 e tem garantia de 60 dias: se não der certo, eu indico outra pessoa sem custo nenhum.\n\nQuer que eu passe o contato?\n\nAgência Exemplo",
      vaga: "Vaga de empregada doméstica, mensal, com carteira assinada, no Terras Alphaville Petrolina. Segunda a sexta, das 7h às 16h.\n\nInteressadas, me chamem no WhatsApp ou mostrem interesse no Ajuda em Casa. Não cobro nada de quem procura trabalho.\n\nAgência Exemplo",
      garantia: "Combinado da garantia: a partir de [data de início], você tem 60 dias de garantia com a Marta. Se ela não se adaptar, eu indico outra profissional sem custo. A garantia continua contando da primeira contratação.\n\nHoje faltam 5 dias.\n\nAgência Exemplo"
    };
    const texto = textos[tipo];
    const tipos = [
      { id: "profissional", label: "Profissional disponível" },
      { id: "vaga", label: "Vaga" },
      { id: "garantia", label: "Garantia" }
    ].map(function (t) {
      const on = t.id === tipo;
      return {
        label: t.label,
        pressed: on ? "true" : "false",
        bg: on ? "#B0472F" : "#FFFFFF",
        fg: on ? "#FFFFFF" : "#2B2B2B",
        border: on ? "#B0472F" : "#E8DED3",
        pick: function () { self.setState({ tipo: t.id, copiado: false }); }
      };
    });
    return {
      tipos: tipos,
      texto: texto,
      linkWhats: "https://wa.me/?text=" + encodeURIComponent(texto),
      rotuloCopiar: s.copiado ? "Copiado!" : "Copiar texto",
      copiar: function () {
        try { navigator.clipboard.writeText(texto); } catch (e) { /* sem área de transferência na prévia */ }
        self.setState({ copiado: true });
      }
    };
  }
}
</script>
<script src="runtime.js"></script>
