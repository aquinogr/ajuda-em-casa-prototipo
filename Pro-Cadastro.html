<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ajuda em Casa · Cadastro de profissional</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0472F}a:hover{color:#8A3522}
</style>
<link rel="stylesheet" href="prototipo.css">
</head>
<body>
<div class="faixa">
<span>Protótipo · dados de exemplo</span>
<span class="faixa-acoes"><a href="telas.html">Todas as telas</a></span>
</div>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 2800px; box-sizing: border-box; background: #FAF5EE; font-family: 'Nunito', system-ui, sans-serif; color: #2B2B2B; display: flex; flex-direction: column">
<div style="padding: 16px 12px 0">
<a href="index.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 16px; font-weight: 800; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
Início</a>
</div>
<section style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15">Cadastro de profissional</h1>
<p style="margin: 0; padding: 14px 16px; border-radius: 16px; background: #E3EDE1; color: #2E4A2B; font-size: 17px; font-weight: 800; line-height: 1.35">Para quem procura trabalho, é de graça. Sempre.</p>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4A433D">Prefere ajuda? A administração faz o cadastro com você pelo WhatsApp ou pessoalmente.</p>
</section>
<form style="padding: 0 20px; display: flex; flex-direction: column; gap: 28px; margin-top: 24px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 14px">
<legend style="padding: 0; margin-bottom: 14px; font-size: 21px; font-weight: 800">1. Seus dados</legend>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="nome" style="font-size: 15px; font-weight: 800">Nome completo</label>
<input id="nome" type="text" autocomplete="name" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="apelido" style="font-size: 15px; font-weight: 800">Como quer aparecer para os moradores</label>
<input id="apelido" type="text" placeholder="Só o primeiro nome" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="whats" style="font-size: 15px; font-weight: 800">WhatsApp</label>
<input id="whats" type="tel" autocomplete="tel" placeholder="(87) 9 0000-0000" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="bairro" style="font-size: 15px; font-weight: 800">Bairro onde você mora</label>
<input id="bairro" type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A">Os moradores veem só o seu primeiro nome e o seu bairro. O WhatsApp aparece só para quem liberar o seu contato, e você é avisado(a) quando isso acontece.</p>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 14px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 21px; font-weight: 800">2. O que você faz</legend>
<p style="margin: 0; font-size: 15px; color: #4A433D">Marque quantos quiser. {{catsCount}}</p>
<template data-for="{{groups}}" data-as="g">
<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 14px; font-weight: 800; color: #6B625A; text-transform: uppercase; letter-spacing: 0.05em">{{g.title}}</h3>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{g.chips}}" data-as="c">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}">{{c.label}}</button>
</template>
</div>
</div>
</template>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 21px; font-weight: 800">3. Como você trabalha</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{formas}}" data-as="c">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 44px; padding: 0 16px; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}">{{c.label}}</button>
</template>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A">Mensal é para quem quer trabalhar mais de 2 dias por semana na mesma casa, com carteira assinada.</p>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 21px; font-weight: 800">4. Dias livres</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<template data-for="{{dias}}" data-as="c">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-width: 64px; min-height: 48px; padding: 0 12px; border-radius: 14px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.border}}">{{c.label}}</button>
</template>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 21px; font-weight: 800">5. Sua experiência</legend>
<label for="exp" style="font-size: 15px; font-weight: 700; color: #4A433D">Conte em poucas linhas o que você já fez</label>
<textarea id="exp" rows="4" placeholder="Ex.: 5 anos em casas de família. Faço limpeza pesada e passo roupa." style="padding: 12px 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; line-height: 1.45; color: #2B2B2B; resize: vertical; box-sizing: border-box"></textarea>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 21px; font-weight: 800">6. Cursos e certificações <span style="font-size: 15px; font-weight: 700; color: #6B625A">(opcional)</span></legend>
<label for="cursos" style="font-size: 15px; font-weight: 700; color: #4A433D">Aparece no seu cartão</label>
<input id="cursos" type="text" placeholder="Ex.: NR-10, curso de cuidador de idosos" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 21px; font-weight: 800">7. Confirme sua identidade</legend>
<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 16px; border: 2px dashed #C9B8A6; border-radius: 16px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; color: #2B2B2B">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B0472F" aria-hidden="true" style="flex-shrink: 0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Foto do seu rosto</span><span style="font-size: 14px; color: #6B625A">Vai aparecer no seu cartão</span></span>
</button>
<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 16px; border: 2px dashed #C9B8A6; border-radius: 16px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; color: #2B2B2B">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B0472F" aria-hidden="true" style="flex-shrink: 0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2.5"></circle><path d="M5.5 16.5c.6-1.6 1.9-2.5 3.5-2.5s2.9.9 3.5 2.5M15 10h3M15 13h3"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Documento com foto</span><span style="font-size: 14px; color: #6B625A">RG ou CNH</span></span>
</button>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A">A administração confere e apaga a foto do documento. Fica guardada só a data da conferência.</p>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 21px; font-weight: 800">8. Certidão de antecedentes <span style="font-size: 15px; font-weight: 700; color: #6B625A">(opcional)</span></legend>
<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 16px; border: 2px dashed #C9B8A6; border-radius: 16px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; color: #2B2B2B">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4F7A4A" aria-hidden="true" style="flex-shrink: 0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 800">Enviar certidão</span><span style="font-size: 14px; color: #6B625A">Ganha o selo "Antecedentes conferidos"</span></span>
</button>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A">A certidão é gratuita e sai pela internet, no site da Polícia Federal.</p>
</fieldset>
<label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E8DED3; font-size: 16px; line-height: 1.45; cursor: pointer">
<input type="checkbox" checked="{{terms}}" onChange="{{toggleTerms}}" style="width: 24px; height: 24px; margin: 0; flex-shrink: 0; accent-color: #B0472F">
<span>Li e aceito os <a href="termos.html">termos de uso</a> e a <a href="privacidade.html">política de privacidade</a>.</span>
</label>
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="Pro-Painel.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">Enviar para conferência</a>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A; text-align: center">Seu cartão aparece para moradores de toda Petrolina depois que a sua identidade for conferida.</p>
</div>
</form>
</div>
</template>
<script type="application/json" id="props">{"$preview":{"width":390,"height":2800}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  toggle(key, value) {
    const s = this.state || {};
    const cur = Object.assign({}, s[key] || {});
    cur[value] = !cur[value];
    const patch = {};
    patch[key] = cur;
    this.setState(patch);
  }
  renderVals() {
    const self = this;
    const s = this.state || {};
    const chips = function (key, list) {
      const sel = s[key] || {};
      return list.map(function (n) {
        const on = !!sel[n];
        return {
          label: n,
          pressed: on ? "true" : "false",
          bg: on ? "#B0472F" : "#FFFFFF",
          fg: on ? "#FFFFFF" : "#2B2B2B",
          border: on ? "#B0472F" : "#E8DED3",
          pick: function () { self.toggle(key, n); }
        };
      });
    };
    const domestico = ["Diarista", "Empregada doméstica", "Babá", "Cozinheira", "Passadeira", "Cuidador(a) de idosos", "Caseiro"];
    const reparos = ["Jardineiro", "Piscineiro", "Pintor", "Pedreiro", "Encanador", "Eletricista", "Técnico de bombas e piscinas", "Limpeza de caixa de gordura", "Limpeza de caixa d'água"];
    const cats = s.cats || {};
    const n = Object.keys(cats).filter(function (k) { return cats[k]; }).length;
    return {
      groups: [
        { title: "Trabalho doméstico", chips: chips("cats", domestico) },
        { title: "Serviços e reparos", chips: chips("cats", reparos) }
      ],
      formas: chips("formas", ["Diária", "Mensal", "Por serviço (visita ou orçamento)"]),
      dias: chips("dias", ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"]),
      catsCount: n === 0 ? "" : (n === 1 ? "1 marcada." : n + " marcadas."),
      terms: !!s.terms,
      toggleTerms: function () { self.setState({ terms: !s.terms }); }
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
