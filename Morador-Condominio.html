<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ajuda em Casa · Onde você mora</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0472F}a:hover{color:#8A3522}
</style>
<link rel="stylesheet" href="prototipo.css">
</head>
<body>
<div class="faixa">
<span>Protótipo · dados de exemplo</span>
<span class="faixa-acoes"><label>Modo <select id="faixa-modo"><option value="gratuito">Gratuito</option><option value="gratuito até data">Gratuito até data</option><option value="pago">Pago</option></select></label><a href="telas.html">Todas as telas</a></span>
</div>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 1450px; box-sizing: border-box; background: #FAF5EE; font-family: 'Nunito', system-ui, sans-serif; color: #2B2B2B; display: flex; flex-direction: column">
<div style="padding: 16px 12px 0">
<a href="index.html" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 8px; font-size: 16px; font-weight: 800; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M15 18l-6-6 6-6"></path></svg>
Início</a>
</div>
<section style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15">Onde você mora?</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: #4A433D">Escolha o seu condomínio. Você pode trocar quando quiser.</p>
<template data-if="{{periodo}}">
<p role="status" style="margin: 4px 0 0; padding: 12px 14px; border-radius: 14px; background: #F6E3DC; color: #6E2A1B; font-size: 15px; font-weight: 800; line-height: 1.4">O Ajuda em Casa será pago a partir de [data].</p>
</template>
</section>
<div style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 6px">
<label for="busca" style="font-size: 15px; font-weight: 800">Buscar condomínio</label>
<div style="position: relative">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B625A" aria-hidden="true" style="position: absolute; left: 14px; top: 16px; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="busca" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Nome do condomínio" style="width: 100%; min-height: 52px; padding: 0 14px 0 44px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<span style="font-size: 14px; color: #6B625A">{{countText}}</span>
</div>
<fieldset style="margin: 14px 20px 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Condomínio</legend>
<template data-for="{{items}}" data-as="c">
<label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; box-sizing: border-box; border-radius: 16px; cursor: pointer; background: {{c.bg}}; border: 2px solid {{c.border}}">
<input type="radio" name="condominio" checked="{{c.checked}}" onChange="{{c.pick}}" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #B0472F">
<span style="display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0">
<span style="font-size: 17px; font-weight: 800">{{c.nome}}</span>
<span style="font-size: 14px; color: #6B625A">{{c.bairro}}</span>
</span>
<template data-if="{{c.destaque}}">
<span style="flex-shrink: 0; padding: 3px 9px; border-radius: 999px; background: #F6E3DC; color: #8A3522; font-size: 12px; font-weight: 800">Em destaque</span>
</template>
</label>
</template>
<template data-if="{{vazio}}">
<p style="margin: 0; padding: 14px 16px; border-radius: 14px; background: #FFFFFF; border: 1px dashed #D9CBBB; font-size: 15px; color: #4A433D">Nenhum condomínio com esse nome.</p>
</template>
<label style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; box-sizing: border-box; border-radius: 16px; cursor: pointer; background: {{fora.bg}}; border: 2px solid {{fora.border}}">
<input type="radio" name="condominio" checked="{{fora.checked}}" onChange="{{fora.pick}}" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #B0472F">
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 17px; font-weight: 800">Não moro em condomínio</span>
<span style="font-size: 14px; color: #6B625A">Informe só o bairro</span>
</span>
</label>
</fieldset>
<template data-if="{{temCondo}}">
<div style="margin: 18px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rua" style="font-size: 15px; font-weight: 800">Alameda, rua ou bloco</label>
<input id="rua" type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="numero" style="font-size: 15px; font-weight: 800">Número do lote, casa ou apartamento</label>
<input id="numero" type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
</div>
</template>
<template data-if="{{foraSel}}">
<div style="margin: 18px 20px 0; display: flex; flex-direction: column; gap: 6px">
<label for="bairro" style="font-size: 15px; font-weight: 800">Seu bairro</label>
<input id="bairro" type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
</template>
<p style="margin: 16px 20px 0; font-size: 14px; line-height: 1.45; color: #6B625A">Não achou o seu condomínio? Escolha "Não moro em condomínio" e informe o bairro. A administração pode incluir o seu na lista.</p>
<div style="margin-top: auto; padding: 16px 20px 26px; background: #FFFFFF; border-top: 1px solid #E8DED3">
<a href="Morador-Lista.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">Continuar</a>
</div>
</div>
</template>
<script type="application/json" id="props">{"modo":{"editor":"enum","options":["gratuito","gratuito até data","pago"],"default":"gratuito","section":"Modo do app"},"$preview":{"width":390,"height":1450}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const s = this.state || {};
    const sel = s.sel || "buona";
    const q = s.q || "";
    const sem = function (t) { return t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };
    const lista = [
      { id: "buona", nome: "Buona Vita", bairro: "Boa Esperança", destaque: true },
      { id: "alpha", nome: "Terras Alphaville Petrolina", bairro: "Boa Esperança", destaque: false },
      { id: "horto", nome: "Horto Condomínio Club", bairro: "Boa Esperança", destaque: false },
      { id: "portal", nome: "Portal das Águas", bairro: "Pedra do Bode", destaque: false },
      { id: "ecospa", nome: "Eco Spa Condominium Club", bairro: "Carneiros", destaque: false },
      { id: "brisas", nome: "Brisas do Rio", bairro: "Tapera", destaque: false },
      { id: "positano", nome: "Positano Eco Residence", bairro: "Cohab São Francisco", destaque: false },
      { id: "valle", nome: "Valle Petrolina", bairro: "Cohab VI", destaque: false }
    ];
    const marca = function (on) { return { bg: on ? "#FFFFFF" : "#FAF5EE", border: on ? "#B0472F" : "#E8DED3" }; };
    const items = lista
      .filter(function (c) { return !q || sem(c.nome).indexOf(sem(q)) !== -1; })
      .map(function (c) {
        const on = c.id === sel;
        return Object.assign({}, c, marca(on), { checked: on, pick: function () { self.setState({ sel: c.id }); } });
      });
    const foraOn = sel === "fora";
    return {
      periodo: (this.props.modo ?? "gratuito") === "gratuito até data",
      q: q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      countText: q ? (items.length === 1 ? "1 encontrado" : items.length + " encontrados") : "206 condomínios de Petrolina. Busque pelo nome.",
      items: items,
      vazio: items.length === 0,
      fora: Object.assign({}, marca(foraOn), { checked: foraOn, pick: function () { self.setState({ sel: "fora" }); } }),
      temCondo: !foraOn,
      foraSel: foraOn
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
