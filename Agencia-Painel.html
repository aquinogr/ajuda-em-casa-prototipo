<a href="{{n.link}}" style="display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E8DED3; text-decoration: none; color: #2B2B2B">

</template>

<section style="margin: 14px 20px 0; padding: 14px 16px; border-radius: 18px; background: #F6E3DC; color: #6E2A1B; display: flex; flex-direction: column; gap: 6px">

<a href="Agencia-Textos.html" style="display: flex; align-items: center; justify-content: center; text-align: center; min-height: 64px; padding: 8px; border-radius: 16px; background: #FFFFFF; border: 2px solid #B0472F; color: #B0472F; font-size: 16px; font-weight: 800; text-decoration: none; box-sizing: border-box">Textos para WhatsApp</a>
</section>
<section style="margin: 16px 20px 0; padding: 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E8DED3; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 800">Contatos de quem autorizou</h2>
<template data-if="{{gratis}}">
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4A433D">Modo gratuito: os contatos estão liberados, sem custo.</p>
</template>
<template data-if="{{pago}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #4A433D">Modo pago. Escolha como liberar os contatos. A sua carteira é sempre grátis.</p>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 14px; border: 2px solid #4F7A4A; border-radius: 14px; background: #FFFFFF; font-family: inherit; text-align: left; cursor: pointer; color: #2B2B2B">
<span style="font-size: 17px; font-weight: 800; color: #3D5F39">Passe Agência · R$ 100</span>
<span style="font-size: 14px; color: #4A433D">30 dias, contatos ilimitados, sem renovação automática</span>
</button>
<a href="Morador-Pacotes.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 800">Ou comprar créditos avulsos</a>

<a href="Agencia-Painel.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 800; color: #B0472F; text-decoration: none">

Painel</a>
<a href="Agencia-Profissionais.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 700; color: #6B625A; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14.8c1.9.7 3.1 2.4 3.5 5.2"></path></svg>
Profissionais</a>
<a href="Agencia-Indicacoes.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 700; color: #6B625A; text-decoration: none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
Indicações</a>
<a href="Agencia-Textos.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 56px; font-size: 13px; font-weight: 700; color: #6B625A; text-decoration: none">

Textos</a>

<script type="application/json" id="props">{"modo":{"editor":"enum","options":["gratuito","pago"],"default":"gratuito","section":"Modo do app"},"$preview":{"width":390,"height":1500}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const pago = (this.props.modo ?? "gratuito") === "pago";
    return {
      pago: pago,
      gratis: !pago,
      numeros: [
        { valor: "3", rotulo: "Em garantia", cor: "#3D5F39", link: "Agencia-Indicacoes.dc.html" },
        { valor: "1", rotulo: "Garantia acabando em 7 dias", cor: "#8A3522", link: "Agencia-Indicacoes.dc.html" },
        { valor: "2", rotulo: "Vagas abertas", cor: "#2B2B2B", link: "Morador-MinhasVagas.dc.html" },
        { valor: "2", rotulo: "Na sua carteira", cor: "#2B2B2B", link: "Agencia-Profissionais.dc.html" }
      ]
    };
  }
}
</script>
