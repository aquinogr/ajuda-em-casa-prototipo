<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ajuda em Casa · Início</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#B0472F">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B0472F}a:hover{color:#8A3522}
</style>
<link rel="stylesheet" href="prototipo.css">
</head>
<body>
<div class="faixa">
<span>Protótipo · dados de exemplo</span>
<span class="faixa-acoes"><a href="telas.html">Todas as telas</a></span>
</div>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 1500px; box-sizing: border-box; background: #FAF5EE; font-family: 'Nunito', system-ui, sans-serif; color: #2B2B2B; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 10px; padding: 20px 20px 4px">
<div style="width: 44px; height: 44px; border-radius: 14px; background: #C8553D; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 20px; font-weight: 800; line-height: 1.1">Ajuda em Casa</span>
<span style="font-size: 13px; font-weight: 700; color: #6B625A">Petrolina</span>
</div>
</header>
<section style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2">O que você procura?</h1>
<div role="group" aria-label="O que você procura" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #EFE6DB">
<template data-for="{{abas}}" data-as="t">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="min-height: 52px; border: 0; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; background: {{t.bg}}; color: {{t.fg}}; box-shadow: {{t.shadow}}">{{t.label}}</button>
</template>
</div>
</section>
<template data-if="{{contratar}}">
<section aria-label="Profissionais" style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<template data-for="{{profissionais}}" data-as="p">
<article style="background: #FFFFFF; border: 1px solid #E8DED3; border-radius: 18px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div role="img" aria-label="Foto de {{p.nome}}" style="width: 72px; height: 72px; border-radius: 50%; background: #F6E3DC; color: #8A3522; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.iniciais}}</div>
<span style="font-size: 17px; font-weight: 800">{{p.nome}}</span>
<span style="font-size: 14px; font-weight: 700; color: #4A433D; line-height: 1.3">{{p.profissao}}</span>
</article>
</template>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A; text-align: center">Para ver o WhatsApp, entre ou crie o seu cadastro.</p>
</section>
</template>
<template data-if="{{trabalhar}}">
<section aria-label="Vagas" style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 10px">
<template data-for="{{vagas}}" data-as="v">
<article style="background: #FFFFFF; border: 1px solid #E8DED3; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 18px; font-weight: 800">{{v.profissao}}</span>
<span style="font-size: 15px; color: #4A433D">{{v.forma}} · {{v.local}}</span>
<template data-if="{{v.agencia}}">
<span style="align-self: flex-start; margin-top: 4px; padding: 2px 10px; border-radius: 999px; background: #E3EDE1; color: #3D5F39; font-size: 13px; font-weight: 800">Publicada pela {{v.agencia}}</span>
</template>
</article>
</template>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B625A; text-align: center">Para mostrar interesse, entre ou crie o seu cadastro. Para quem procura trabalho, é de graça.</p>
</section>
</template>
<section style="margin: 20px 20px 0; padding: 20px; background: #FFFFFF; border: 1px solid #E8DED3; border-radius: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">Entrar</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 15px; font-weight: 800">E-mail</label>
<input id="email" type="email" autocomplete="email" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="senha" style="font-size: 15px; font-weight: 800">Senha</label>
<input id="senha" type="password" autocomplete="current-password" style="min-height: 52px; padding: 0 14px; border: 2px solid #E8DED3; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 17px; color: #2B2B2B; box-sizing: border-box">
</div>
<a href="Inicio.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #B0472F; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">Entrar</a>
<a href="Inicio.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 16px; border: 2px solid #E8DED3; color: #2B2B2B; font-size: 16px; font-weight: 800; text-decoration: none; box-sizing: border-box">Entrar com Google</a>
<div style="display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap">
<a href="Cadastro.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 16px; font-weight: 800">Criar cadastro</a>
<a href="Esqueci-Senha.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 16px; font-weight: 800">Esqueci minha senha</a>
</div>
</section>
<footer style="margin-top: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #6B625A">
<span>Um serviço da MCCR · CNPJ 48.921.916/0001-00</span>
<span><a href="termos.html">Termos de uso</a> · <a href="privacidade.html">Política de privacidade</a></span>
</footer>
</div>
</template>
<script type="application/json" id="props">{"$preview":{"width":390,"height":1500}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const aba = (this.state || {}).aba || "contratar";
    const abas = [
      { id: "contratar", label: "Quero contratar" },
      { id: "trabalhar", label: "Quero trabalhar" }
    ].map(function (t) {
      const on = t.id === aba;
      return {
        label: t.label,
        pressed: on ? "true" : "false",
        bg: on ? "#FFFFFF" : "transparent",
        fg: on ? "#2B2B2B" : "#5E554D",
        shadow: on ? "0 1px 3px rgba(43, 43, 43, 0.14)" : "none",
        pick: function () { self.setState({ aba: t.id }); }
      };
    });
    const profissionais = [
      ["Joana", "Diarista"], ["Cida", "Diarista · Passadeira"], ["Marta", "Babá"], ["Lúcia", "Cozinheira"],
      ["Rafael", "Eletricista"], ["Severino", "Pedreiro"], ["Edna", "Cuidadora de idosos"], ["Paulo", "Jardineiro"]
    ].map(function (p) { return { nome: p[0], profissao: p[1], iniciais: p[0].slice(0, 2).toUpperCase() }; });
    const vagas = [
      { profissao: "Diarista", forma: "Diária", local: "Buona Vita", agencia: "" },
      { profissao: "Empregada doméstica", forma: "Mensal", local: "Terras Alphaville Petrolina", agencia: "Agência Exemplo" },
      { profissao: "Babá", forma: "Mensal", local: "Bairro Areia Branca", agencia: "" },
      { profissao: "Eletricista", forma: "Por serviço", local: "Portal das Águas", agencia: "" }
    ];
    return {
      abas: abas,
      contratar: aba === "contratar",
      trabalhar: aba === "trabalhar",
      profissionais: profissionais,
      vagas: vagas
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
