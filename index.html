<script type="application/json" id="props">{"modo":{"editor":"enum","options":["gratuito","pago"],"default":"gratuito","section":"Modo do app"},"$preview":{"width":390,"height":1730}}</script>
<script type="text/x-dc-logic" id="logic">
class Component extends DCLogic {
  renderVals() {
    const pago = (this.props.modo ?? "gratuito") === "pago";
    const domestico = ["Diarista", "Empregada doméstica", "Babá", "Cozinheira", "Passadeira", "Cuidador(a) de idosos", "Caseiro"];
    const reparos = ["Jardineiro", "Piscineiro", "Pintor", "Pedreiro", "Encanador", "Eletricista", "Técnico de bombas e piscinas", "Limpeza de caixa de gordura", "Limpeza de caixa d'água"];
    const toItem = function (n) { return { name: n }; };
    const textos = [
      "Escolha o seu condomínio ou bairro.",
      "Veja os perfis: foto, dias livres, experiência e avaliações.",
      pago ? "Use 1 crédito para liberar o WhatsApp da pessoa." : "Toque em \"Ver WhatsApp\" para falar com a pessoa.",
      "Combine valor, dias e horário direto com ela."
    ];
    return {
      pago: pago,
      gratis: !pago,
      groups: [
        { title: "Trabalho doméstico", items: domestico.map(toItem) },
        { title: "Serviços e reparos", items: reparos.map(toItem) }
      ],
      dispNote: pago
        ? "Só conta quem confirmou disponibilidade nos últimos 14 dias."
        : "Profissionais com identidade conferida, para qualquer condomínio ou bairro de Petrolina.",
      steps: textos.map(function (t, i) { return { n: String(i + 1), text: t }; })
    };
  }
}
</script>
